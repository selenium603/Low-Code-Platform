<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1960" viewBox="0 0 1500 1960" role="img" aria-labelledby="title desc">
  <title id="title">AI 页面修改跨轮完整实现链路</title>
  <desc id="desc">展示每条消息对应一次 Graph Run，澄清结束本轮调用但保留 awaiting_user 任务，下一条消息再次经过完整意图识别，预算用尽后进入确定性执行策略。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
    <style>
      .title{font:600 30px system-ui,"Microsoft YaHei",sans-serif;fill:#0f172a}.subtitle{font:400 16px system-ui,"Microsoft YaHei",sans-serif;fill:#475569}.node{fill:#f8fafc;stroke:#64748b;stroke-width:2}.intent{fill:#eff6ff;stroke:#2563eb}.policy{fill:#fff7ed;stroke:#ea580c}.edit{fill:#f0fdf4;stroke:#16a34a}.terminal{fill:#faf5ff;stroke:#9333ea}.pending{fill:#fefce8;stroke:#ca8a04}.text{font:500 17px system-ui,"Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:middle}.small{font:400 14px system-ui,"Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrowDash)}
    </style>
  </defs>
  <rect width="1500" height="1960" fill="#ffffff"/>
  <text x="750" y="42" class="title" text-anchor="middle">AI 页面修改跨轮完整实现链路</text>
  <text x="750" y="72" class="subtitle" text-anchor="middle">一条用户消息对应一次 Graph Run；澄清只结束本轮调用，不结束业务任务</text>

  <g>
    <rect class="node" x="550" y="105" width="400" height="58" rx="12"/><text class="text" x="750" y="134">用户发送任意消息</text>
    <rect class="node" x="550" y="195" width="400" height="64" rx="12"/><text class="text" x="750" y="219">前端立即永久保存消息</text><text class="small" x="750" y="243">消息发送与页面执行解耦</text>
    <rect class="node" x="550" y="291" width="400" height="58" rx="12"/><text class="text" x="750" y="320">调用 edit-page API</text>
    <rect class="node" x="550" y="381" width="400" height="64" rx="12"/><text class="text" x="750" y="405">创建本轮 LangGraph State</text><text class="small" x="750" y="429">读取并校验 pendingTask</text>
    <path class="edge" d="M750 163V195"/><path class="edge" d="M750 259V291"/><path class="edge" d="M750 349V381"/>
  </g>

  <g>
    <rect class="node intent" x="75" y="505" width="310" height="66" rx="12"/><text class="text" x="230" y="528">规则意图路由</text><text class="small" x="230" y="553">仅整句高置信规则</text>
    <rect class="node intent" x="595" y="505" width="310" height="66" rx="12"/><text class="text" x="750" y="538">上下文语义路由</text>
    <rect class="node intent" x="1115" y="505" width="310" height="66" rx="12"/><text class="text" x="1270" y="528">工具路由兜底</text><text class="small" x="1270" y="553">技术失败不消耗预算</text>
    <path class="edge" d="M750 445V475H230V505"/><path class="edge" d="M385 538H595"/><text class="small" x="490" y="526">无法确定</text><path class="edge" d="M905 538H1115"/><text class="small" x="1010" y="519">技术重试后仍失败</text>
    <rect class="node policy" x="550" y="645" width="400" height="66" rx="12"/><text class="text" x="750" y="668">确定性决策校正</text><text class="small" x="750" y="693">无 pending 时 relation 强制为 none</text>
    <path class="edge" d="M230 571V607H640V645"/><path class="edge" d="M750 571V645"/><path class="edge" d="M1270 571V607H860V645"/>
    <rect class="node policy" x="550" y="765" width="400" height="62" rx="12"/><text class="text" x="750" y="796">任务状态归并器</text><path class="edge" d="M750 711V765"/>
  </g>

  <g>
    <rect class="node terminal" x="45" y="900" width="255" height="66" rx="12"/><text class="text" x="172" y="923">页面 QA 应答</text><text class="small" x="172" y="948">保留或清理 pending</text>
    <rect class="node terminal" x="350" y="900" width="255" height="66" rx="12"/><text class="text" x="477" y="923">取消 pendingTask</text><text class="small" x="477" y="948">task_cancelled</text>
    <rect class="node policy" x="655" y="900" width="255" height="66" rx="12"/><text class="text" x="782" y="923">创建新根任务</text><text class="small" x="782" y="948">预算重新为 0</text>
    <rect class="node policy" x="960" y="900" width="255" height="66" rx="12"/><text class="text" x="1087" y="923">恢复并合并旧任务</text><text class="small" x="1087" y="948">answer / supplement / delegate</text>
    <path class="edge" d="M650 827V860H172V900"/><text class="small" x="295" y="854">question / chat</text>
    <path class="edge" d="M700 827V870H477V900"/><text class="small" x="500" y="864">cancel</text>
    <path class="edge" d="M800 827V900"/><text class="small" x="839" y="860">replace / 新请求</text>
    <path class="edge" d="M850 827V860H1087V900"/>

    <rect class="node policy" x="805" y="1035" width="400" height="62" rx="12"/><text class="text" x="1005" y="1066">编辑预分析</text>
    <path class="edge" d="M782 966V1005H920V1035"/><path class="edge" d="M1087 966V1005H1090V1035"/>
    <rect class="node policy" x="805" y="1165" width="400" height="68" rx="12"/><text class="text" x="1005" y="1188">澄清 Broker</text><text class="small" x="1005" y="1215">只选择业务歧义；技术错误走 retry</text><path class="edge" d="M1005 1097V1165"/>
  </g>

  <g>
    <rect class="node pending" x="380" y="1295" width="350" height="82" rx="12"/><text class="text" x="555" y="1318">保存 pendingTask</text><text class="small" x="555" y="1343">status = awaiting_user</text><text class="small" x="555" y="1363">clarificationUsed = 1</text>
    <path class="edge" d="M925 1233V1265H555V1295"/><text class="small" x="715" y="1258">预算为 0 且值得询问</text>
    <rect class="node terminal" x="380" y="1435" width="350" height="68" rx="12"/><text class="text" x="555" y="1458">clarification_requested</text><text class="small" x="555" y="1485">结束本轮 Graph Run</text><path class="edge" d="M555 1377V1435"/>

    <rect class="node policy" x="900" y="1295" width="420" height="82" rx="12"/><text class="text" x="1110" y="1318">代码推导确定性执行策略</text><text class="small" x="1110" y="1343">预算已用：canClarify = false</text><text class="small" x="1110" y="1363">模型在安全边界内自主决定</text>
    <path class="edge" d="M1085 1233V1295"/><text class="small" x="1205" y="1263">无需询问或预算已用</text>
    <polygon class="node policy" points="1110,1425 1225,1480 1110,1535 995,1480"/><text class="text" x="1110" y="1480">编辑意图</text><path class="edge" d="M1110 1377V1425"/>

    <rect class="node edit" x="750" y="1590" width="210" height="62" rx="12"/><text class="text" x="855" y="1621">局部修改子图</text>
    <rect class="node edit" x="1010" y="1590" width="210" height="62" rx="12"/><text class="text" x="1115" y="1621">大幅修改子图</text>
    <rect class="node edit" x="1270" y="1590" width="200" height="62" rx="12"/><text class="text" x="1370" y="1621">整页重排子图</text>
    <path class="edge" d="M1055 1507L855 1590"/><text class="small" x="920" y="1544">local_edit</text><path class="edge" d="M1110 1535V1590"/><text class="small" x="1160" y="1560">large_edit</text><path class="edge" d="M1170 1509L1370 1590"/><text class="small" x="1320" y="1544">full_relayout</text>

    <rect class="node edit" x="960" y="1710" width="360" height="62" rx="12"/><text class="text" x="1140" y="1741">最终页面校验与结果归一化</text>
    <path class="edge" d="M855 1652V1680H1050V1710"/><path class="edge" d="M1115 1652V1710"/><path class="edge" d="M1370 1652V1680H1230V1710"/>
    <rect class="node terminal" x="960" y="1825" width="360" height="68" rx="12"/><text class="text" x="1140" y="1848">页面执行结果</text><text class="small" x="1140" y="1875">completed / no_change / conflict / failed</text><path class="edge" d="M1140 1772V1825"/>
  </g>

  <g>
    <rect class="node terminal" x="75" y="1590" width="330" height="66" rx="12"/><text class="text" x="240" y="1613">返回本轮结果</text><text class="small" x="240" y="1638">不是业务任务必然结束</text>
    <path class="edge" d="M172 966V1545H190V1590"/><path class="edge" d="M477 966V1525H290V1590"/><path class="edge" d="M555 1503V1545H345V1590"/><path class="edge" d="M960 1859H700V1623H405"/>
    <rect class="node" x="75" y="1710" width="330" height="70" rx="12"/><text class="text" x="240" y="1733">前端更新消息和任务状态</text><text class="small" x="240" y="1760">永远不删除用户消息</text><path class="edge" d="M240 1656V1710"/>
    <polygon class="node pending" points="240,1820 350,1870 240,1920 130,1870"/><text class="text" x="240" y="1858">仍有 awaiting_user</text><text class="small" x="240" y="1882">pendingTask?</text><path class="edge" d="M240 1780V1820"/>
    <text class="small" x="388" y="1885">否：本轮结束</text>
    <path class="edge" d="M130 1870H35V134H550"/><text class="small" x="50" y="990" transform="rotate(-90 50 990)">是：用户发送任意下一条消息，再次进入完整意图识别</text>
  </g>

  <g>
    <rect class="node pending" x="65" y="1110" width="600" height="132" rx="12"/>
    <text class="text" x="365" y="1135">澄清后的下一条消息仍由意图层理解</text>
    <text class="small" x="365" y="1165">回答 / 补充 / 交给 AI → 恢复旧任务；预算已用则自主执行</text>
    <text class="small" x="365" y="1194">问题 / 闲聊 → QA 回答并保留旧任务</text>
    <text class="small" x="365" y="1223">新修改 → 替换旧任务；取消 → 取消旧任务</text>
    <path class="dash" d="M365 1110V1040H90V195H550"/>
  </g>
</svg>
